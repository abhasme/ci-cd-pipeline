name: Auto Deploy on Push

on:
  push:
    branches: [ "main" ]  # or your branch

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: pm2 restart app || echo "pm2 app not running"
